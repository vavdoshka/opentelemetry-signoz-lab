# Boots the whole lab from nothing on a clean x86 Linux machine, for each
# supported cluster provider. `make up` ends with a smoke test that proves
# traces, logs and metrics reach SigNoz.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: make up (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        provider: [k3d, kind]
    env:
      PROVIDER: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v7

      - name: Install k3d
        if: matrix.provider == 'k3d'
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash

      - name: Install kind
        if: matrix.provider == 'kind'
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install kind /usr/local/bin/kind

      - name: Show tool versions
        run: |
          docker version --format 'docker {{.Server.Version}}'
          kubectl version --client
          helm version --short
          python3 --version

      - name: Make *.localhost resolve
        run: echo '127.0.0.1 lab1.localhost lab2.localhost lab3.localhost lab4.localhost lab5.localhost mcp.localhost signoz.localhost' | sudo tee -a /etc/hosts

      - name: Check tutorial code quotes
        run: python3 scripts/check_tutorial_quotes.py

      - name: Check prerequisites
        run: make check

      - name: Boot SigNoz and Lab 1
        run: make up

      - name: Deploy Lab 2
        run: make lab2

      - name: Compare the labs
        run: make compare

      - name: Deploy Lab 3
        run: make lab3

      - name: Deploy Lab 4
        run: make lab4

      - name: Prove a real failure raises an alert
        run: python3 scripts/smoke_alerts.py
      # No Claude login here, so this proves everything except the AI itself: the
      # MCP server, its read-only access, and that alerts reach the investigator.
      - name: Deploy Lab 5
        run: make lab5

      - name: Rerun make up
        run: make up

      - name: Show status
        run: make status

      - name: Check the tutorial starts
        run: |
          python3 tutorial/server.py &
          sleep 3
          curl -fsS http://127.0.0.1:8765/ -o /dev/null
          curl -fsS http://127.0.0.1:8765/live/status

      - name: Show diagnostics
        if: failure()
        run: |
          context="${{ matrix.provider }}-signoz-lab"
          kubectl --context "$context" get pods -A -o wide || true
          kubectl --context "$context" get events -A --sort-by=.lastTimestamp | tail -40 || true
