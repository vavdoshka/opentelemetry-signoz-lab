# Lab 3: added on top of signoz/k8s-infra-values.yaml by `make lab3`.
#
# k8s-infra's defaults use the kubelet's summary API, which has no throttling,
# probe or kubelet health data. These jobs read that from the raw Prometheus
# endpoints instead. They run in the one cluster collector, so nothing is
# scraped twice. On a large cluster, move the kubelet jobs to the node agents.
#
# Every job has a keep-list. Those endpoints expose over 30,000 series here, and
# SigNoz stores everything it is sent.
presets:
  logsCollection:
    blacklist:
      # The chart leaves out kube-system, but its pods are part of the cluster
      # you're debugging: CoreDNS and Traefik here. On kubeadm clusters such as
      # kind, the API server, scheduler, controller manager and etcd too.
      namespaces: []
      # The audit log pod's output is read by filelog/audit below instead.
      containers: [audit-log]

  prometheus:
    enabled: true
    # `enabled` also turns on a job that scrapes every pod annotated with
    # signoz.io/scrape. SigNoz's own ClickHouse, ZooKeeper and collectors are, and
    # that added 5,239 series, more than double the jobs below. No pod in lab3 has
    # the annotation, so limiting that job to lab3 turns it off.
    namespaces: [lab3]
    scrapeConfigs:
      # The kubelet's health, and its view of the container runtime.
      - job_name: kubelet
        scrape_interval: 30s
        scheme: https
        authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
        tls_config: { insecure_skip_verify: true }
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_node_name], target_label: node }
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: go_goroutines|kubelet_(running_pods|running_containers|started_pods_total|pleg_relist_duration_seconds_(sum|count)|pleg_last_seen_seconds|runtime_operations_total|runtime_operations_errors_total|runtime_operations_duration_seconds_(bucket|sum|count)|pod_start_duration_seconds_(bucket|sum|count)|evictions)|storage_operation_duration_seconds_(bucket|sum|count)

      # cAdvisor, which is built into the kubelet: throttling and OOM events.
      - job_name: cadvisor
        scrape_interval: 30s
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
        tls_config: { insecure_skip_verify: true }
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_node_name], target_label: node }
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: container_cpu_cfs_(throttled_)?periods_total|container_cpu_cfs_throttled_seconds_total|container_oom_events_total
          # An empty container label means the pod's cgroup or its pause container.
          - { source_labels: [container], action: drop, regex: "" }
          - { action: labeldrop, regex: id|image|name }

      # Every probe result, by pod and probe type.
      - job_name: kubelet-probes
        scrape_interval: 30s
        scheme: https
        metrics_path: /metrics/probes
        authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
        tls_config: { insecure_skip_verify: true }
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_node_name], target_label: node }
        metric_relabel_configs:
          - { source_labels: [__name__], action: keep, regex: prober_probe_total }

      # The API server. This job is the same on any cluster that exposes it.
      - job_name: apiserver
        scrape_interval: 30s
        scheme: https
        authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server_name: kubernetes.default.svc
        kubernetes_sd_configs:
          - { role: endpoints, namespaces: { names: [default] } }
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: kubernetes;https
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: apiserver_request_total|apiserver_request_sli_duration_seconds_(bucket|sum|count)|apiserver_current_inflight_requests|apiserver_longrunning_requests|apiserver_storage_objects|workqueue_depth|process_cpu_seconds_total|process_resident_memory_bytes|go_goroutines

# Two node logs that aren't ordinary pod logs. Both are only written because
# cluster/k3d-config.yaml and cluster/kind-config.yaml turn them on when the
# cluster is created.
otelAgent:
  config:
    receivers:
      # k3s's own log: its kubelet, API server, scheduler and controller manager
      # all run in the k3s process and write here. Each node has one. The agents
      # already mount the node's /var/log. kind has no such file, so on kind
      # this receiver finds nothing.
      filelog/k3s:
        include: [/var/log/k3s.log]
        # Read only new lines, like the chart's pod logs. Lines written while an
        # agent restarts are missed.
        start_at: end
        operators:
          # Some messages run over several lines. Join every line that doesn't
          # start a new message onto the one before it.
          - type: recombine
            combine_field: body
            is_first_entry: body matches "^([IWEF]\\d{4} |time=)"
            # Which lines belong together. There's one file, so its name does.
            source_identifier: attributes["log.file.name"]
          # Kubernetes components log like this:
          #   E1107 21:07:14.366878  23 info.go:114] Failed to get system UUID
          # The first letter is the level. There's no year, so the timestamp is
          # when the agent read the line, a fraction of a second later.
          - type: regex_parser
            if: body matches "^[IWEF]\\d{4} "
            regex: '^(?P<level>[IWEF])\d{4} '
            severity:
              parse_from: attributes.level
              mapping: { info: I, warn: W, error: E, fatal: F }
              overwrite_text: true
          # k3s itself logs like this:
          #   time="2026-11-07T21:13:43Z" level=warning msg="Proxy error: ..."
          - type: regex_parser
            if: body matches "^time="
            regex: '^time="(?P<time>[^"]+)" level=(?P<level>\w+)'
            timestamp: { parse_from: attributes.time, layout_type: gotime, layout: "2006-01-02T15:04:05Z07:00" }
            severity:
              parse_from: attributes.level
              mapping: { warn: warning }
              overwrite_text: true
          - { type: remove, field: attributes.level, if: "attributes.level != nil" }
          - { type: remove, field: attributes.time, if: "attributes.time != nil" }
          # Name the source, so you can search for service.name = 'k3s'.
          - { type: add, field: 'resource["service.name"]', value: k3s }

      # The API server's audit log, one JSON object per request. The agents
      # can't open the file itself, so k8s/audit-log.yaml runs a pod that
      # prints it, and this reads that pod's output. The body keeps the whole
      # event, and these operators copy the fields worth searching on into
      # attributes.
      filelog/audit:
        include: [/var/log/pods/lab3_audit-log-*/audit-log/*.log]
        # The file name is the pod log's, 0.log, which says nothing.
        include_file_name: false
        start_at: end
        operators:
          # The container runtime writes each line as "<time> <stream> <tag> <line>".
          # Keep the line, and drop anything tail writes to stderr, such as a
          # note that the file was rotated.
          - type: regex_parser
            regex: '^\S+ (?P<stream>stdout|stderr) \S+ (?P<line>.*)$'
          - { type: filter, expr: 'attributes.stream != "stdout"' }
          - { type: move, from: attributes.line, to: body }
          - { type: remove, field: attributes.stream }
          - type: json_parser
            parse_to: attributes.event
            timestamp: { parse_from: attributes.event.requestReceivedTimestamp, layout_type: gotime, layout: "2006-01-02T15:04:05.999999999Z07:00" }
          # Who called: a user, or system:serviceaccount:<namespace>:<name>.
          - { type: move, from: attributes.event.user.username, to: 'attributes["k8s.audit.user"]' }
          - { type: move, from: attributes.event.userAgent, to: 'attributes["k8s.audit.user_agent"]', if: "attributes.event.userAgent != nil" }
          # What they asked for. Requests that aren't for an object, such as
          # /api, have no resource, and cluster-wide objects have no namespace.
          # A move fails if its field is missing, hence the `if`s.
          - { type: move, from: attributes.event.verb, to: 'attributes["k8s.audit.verb"]' }
          - { type: move, from: attributes.event.objectRef.resource, to: 'attributes["k8s.audit.resource"]', if: "attributes.event.objectRef?.resource != nil" }
          - { type: move, from: attributes.event.objectRef.namespace, to: 'attributes["k8s.audit.namespace"]', if: "attributes.event.objectRef?.namespace != nil" }
          - { type: move, from: attributes.event.requestURI, to: 'attributes["k8s.audit.uri"]' }
          # The answer: 200, 403 and so on.
          - { type: move, from: attributes.event.responseStatus.code, to: 'attributes["k8s.audit.code"]', if: "attributes.event.responseStatus?.code != nil" }
          - { type: remove, field: attributes.event }
          - { type: add, field: 'resource["service.name"]', value: kube-apiserver-audit }

    service:
      pipelines:
        # A pipeline of their own, so the chart's `logs` pipeline is left as it
        # is. Helm replaces lists rather than merging them, so adding these
        # receivers there would mean copying the chart's list too.
        # resourcedetection adds the node and cluster names. k8sattributes is
        # left out: these lines are about the node and the API server, not
        # about the pod that relays the audit log.
        logs/node:
          receivers: [filelog/k3s, filelog/audit]
          processors: [resourcedetection, batch]
          exporters: [otlphttp]
