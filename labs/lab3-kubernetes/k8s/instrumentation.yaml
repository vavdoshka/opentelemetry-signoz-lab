# This file is all the OpenTelemetry configuration Lab 3 has, the same as Lab 1.
#
# The annotation on the Namespace opts in every pod created here. The
# Instrumentation resource tells the Operator how to instrument them. It must
# exist before the pods start, because injection happens at pod creation.
apiVersion: v1
kind: Namespace
metadata:
  name: lab3
  annotations:
    instrumentation.opentelemetry.io/inject-python: "true"
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: zero-code
  namespace: lab3
spec:
  exporter:
    # The SigNoz agent on the same node.
    endpoint: http://k8s-infra-otel-agent.signoz.svc.cluster.local:4318
  sampler:
    # Keep every trace, the same as the SDK default.
    type: parentbased_always_on
  propagators:
    - tracecontext
    - baggage
  resource:
    resourceAttributes:
      deployment.environment: lab3
  python:
    env:
      # Logs take one path: the app prints them, and the node agents read every
      # container's output. Sending them over OTLP as well would store each line
      # twice, as Labs 1 and 2 do.
      - { name: OTEL_PYTHON_LOG_AUTO_INSTRUMENTATION, value: "false" }
      # Prints each line's trace and span IDs, so it still links to its trace.
      - { name: OTEL_PYTHON_LOG_CORRELATION, value: "true" }
      # The line's exact format. SigNoz's log pipeline, from log-pipeline.json,
      # reads the IDs back out of it, so change the two together.
      - { name: OTEL_PYTHON_LOG_FORMAT, value: "%(asctime)s %(levelname)s [%(name)s] [trace_id=%(otelTraceID)s span_id=%(otelSpanID)s service.name=%(otelServiceName)s] %(message)s" }
      # Don't create spans for kubelet probe calls.
      - { name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS, value: healthz }
      # Service Map fix. See gap 2 in docs/FINDINGS.md.
      - { name: OTEL_BSP_SCHEDULE_DELAY, value: "500" }
      # Export metrics every 10 seconds (default 60), so the lab feels responsive.
      - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "10000" }
