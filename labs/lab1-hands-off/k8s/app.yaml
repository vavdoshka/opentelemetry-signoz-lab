# Lab 1's app: no OpenTelemetry code, and no OTEL_* settings at all.
# The Operator names each service after its Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lab1
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
      annotations:
        # Opt out: the Namespace annotation would otherwise inject Python here too.
        instrumentation.opentelemetry.io/inject-python: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: lab }
            - { name: POSTGRES_PASSWORD, value: lab }
            - { name: POSTGRES_DB, value: lab }
          ports: [{ containerPort: 5432 }]
          resources: { requests: { cpu: 50m, memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: lab1 }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab1-backend
  namespace: lab1
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: telemetry-lab1:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "backend:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - { name: DATABASE_URL, value: "postgresql://lab:lab@postgres:5432/lab" }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: lab1 }
spec:
  selector: { app: backend }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab1-frontend
  namespace: lab1
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: telemetry-lab1:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "frontend:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - { name: BACKEND_URL, value: "http://backend:8000" }
            - { name: SIGNOZ_URL, value: "http://signoz.localhost:8080" }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: lab1 }
spec:
  selector: { app: frontend }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab1-loadgen
  namespace: lab1
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata: { labels: { app: loadgen } }
    spec:
      containers:
        - name: loadgen
          image: telemetry-lab1:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "frontend:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - { name: LOADGEN_TARGET, value: "http://frontend:8000" }
            - { name: BACKEND_URL, value: "http://backend:8000" }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: loadgen, namespace: lab1 }
spec:
  selector: { app: loadgen }
  ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: frontend, namespace: lab1 }
spec:
  ingressClassName: traefik
  rules:
    - host: lab1.localhost
      http:
        paths:
          - path: /api/load
            pathType: Prefix
            backend: { service: { name: loadgen, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 8000 } } }
