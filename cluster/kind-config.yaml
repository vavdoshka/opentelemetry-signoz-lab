# kind cluster: two Kubernetes nodes running in Docker.
# kind has no ingress controller, so scripts/up.sh installs Traefik on the
# control-plane node. Host port 8080 maps to Traefik's port 80 there.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: signoz-lab
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
  - role: worker
